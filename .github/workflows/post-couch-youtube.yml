name: Post couple reels to YouTube
# After every "Post reel" run, puts the couple reel that just went to Instagram on the couch reels YouTube channel as a
# public Short (tools/couch_youtube.py), so it shows on YouTube a few minutes after Instagram. One reel per Instagram
# post, nothing scheduled ahead. Needs the YT_COUCH_CLIENT_ID, YT_COUCH_CLIENT_SECRET and YT_COUCH_REFRESH_TOKEN
# secrets; until they exist it uploads nothing.
on:
  workflow_run:
    workflows: ['Post reel']
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show what would be uploaded (checks the YouTube sign-in)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: post-couch-youtube
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Upload the new couple reel as a Short
        env:
          YT_CLIENT_ID: ${{ secrets.YT_COUCH_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_COUCH_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_COUCH_REFRESH_TOKEN }}
        run: |
          git pull -q --rebase || true
          python tools/couch_youtube.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
      - name: Record it in couch_youtube_posted.json
        if: always()
        run: |
          git config user.name "reel-bot"; git config user.email "reel-bot@users.noreply.github.com"
          git add couch_youtube_posted.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "Couple reel on YouTube [skip ci]"
            for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep $((i * 5)); done
          fi
