name: Make mechanic reels
# Mechanic "how it works" reels (mechreels/ folder). When a reel folder changes on main (or you run this by hand), GitHub makes the
# voiceover with ElevenLabs (word timestamps included), re-times the animation to it, renders the 9:16 MP4 and publishes it as a
# Release "mechreel-<id>" with the MP4, a cover frame, the caption to paste and the interactive player page.
on:
  push:
    branches: [main]
    paths: ['mechreels/reels/**', 'mechreels/config.json', 'mechreels/style/**']
  workflow_dispatch:
    inputs:
      reel:
        description: 'Reel folder in mechreels/reels to make, e.g. 01-car-differential (empty = every reel without a release yet)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: make-mechreels
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: mechreels
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg, Chromium and the font
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q playwright==1.48.0 numpy requests pillow
          python -m playwright install --with-deps chromium
          mkdir -p ~/.local/share/fonts && cp fonts/*.ttf ~/.local/share/fonts/ && fc-cache -f
      - name: Pick the reels to make
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.reel }}" ]; then
            LIST="${{ inputs.reel }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- config.json style | grep -q .; then
              LIST=$(ls reels | tr '\n' ' ')   # voice or style changed: remake every reel
            else
              LIST=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- reels | grep -v '/voice' | grep -v '/timing.json' | cut -d/ -f3 | sort -u | tr '\n' ' ')
            fi
          else
            LIST=""; for d in reels/*/; do id=$(basename "$d"); gh release view "mechreel-$id" >/dev/null 2>&1 || LIST="$LIST $id"; done
          fi
          echo "list=$LIST" >> "$GITHUB_OUTPUT"; echo "Reels to make: $LIST"
      - name: Voice, render, release
        if: steps.pick.outputs.list != ''
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "reel-bot"; git config user.email "reel-bot@users.noreply.github.com"
          FAILED=""
          for id in ${{ steps.pick.outputs.list }}; do
            [ -f "reels/$id/story.js" ] || continue
            echo "::group::Making $id"
            git pull --rebase -q || true   # pick up voices a previous run already paid for
            if ! python tools/produce.py "reels/$id" --workers "$(nproc)" > "/tmp/$id.log" 2>&1; then
              cat "/tmp/$id.log"
              echo "::error::$id failed: $(tail -n 12 "/tmp/$id.log" | tr '\n' ' ' | cut -c1-900)"; FAILED="$FAILED $id"
              git add "reels/$id/voice.mp3" "reels/$id/timing.json" "reels/$id/voice_raw.json" 2>/dev/null || true
              git diff --cached --quiet || (git commit -m "Voiceover for mechanic reel $id [skip ci]" && git pull --rebase -q && git push)
              echo "::endgroup::"; continue
            fi
            cat "/tmp/$id.log"
            # keep the paid-for voice in the repo so a re-render never pays twice
            git add "reels/$id/voice.mp3" "reels/$id/timing.json" "reels/$id/voice_raw.json" 2>/dev/null || true
            git diff --cached --quiet || (git commit -m "Voiceover for mechanic reel $id [skip ci]" && git pull --rebase -q && git push)
            gh release delete "mechreel-$id" --yes --cleanup-tag >/dev/null 2>&1 || true
            TITLE=$(python -c "import json;print(json.load(open('reels/$id/meta.json'))['title'])")
            gh release create "mechreel-$id" "out/$id/$id.mp4" "out/$id/cover.jpg" "out/$id/caption.txt" "out/$id/${id}_player.html" --title "$TITLE" --notes-file "out/$id/caption.txt"
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then echo "::error::Not made:$FAILED"; exit 1; fi
