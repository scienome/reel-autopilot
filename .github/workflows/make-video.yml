name: Make YouTube video
# YouTube videos (youtube/ folder). When a video folder changes on main (or you run this by hand), GitHub makes the voiceover with ElevenLabs, renders the
# 1080p video, and publishes it as a Release with the MP4, the thumbnail and the YouTube text.
on:
  push:
    branches: [main]
    paths: ['youtube/videos/**']
  workflow_dispatch:
    inputs:
      video:
        description: 'Video folder in youtube/videos to make, e.g. 001-moon-disappeared (empty = every video without a release yet)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: make-video
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: youtube
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg, Chromium and the fonts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q playwright==1.48.0 numpy requests pillow
          python -m playwright install --with-deps chromium
          mkdir -p ~/.local/share/fonts && cp fonts/*.ttf ~/.local/share/fonts/ && fc-cache -f
      - name: Pick the videos to make
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.video }}" ]; then
            LIST="${{ inputs.video }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            LIST=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- videos | grep -v '/voice' | grep -v '/timing.json' | cut -d/ -f3 | sort -u | tr '\n' ' ')
          else
            LIST=""; for d in videos/*/; do id=$(basename "$d"); gh release view "video-$id" >/dev/null 2>&1 || LIST="$LIST $id"; done
          fi
          echo "list=$LIST" >> "$GITHUB_OUTPUT"; echo "Videos to make: $LIST"
      - name: Voice, render, release
        if: steps.pick.outputs.list != ''
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "video-bot"; git config user.email "video-bot@users.noreply.github.com"
          for id in ${{ steps.pick.outputs.list }}; do
            [ -f "videos/$id/story.js" ] || continue
            echo "::group::Making $id"
            python tools/produce.py "videos/$id" --workers "$(nproc)"
            # keep the paid-for voice in the repo so a re-render never pays twice
            git add "videos/$id/voice.mp3" "videos/$id/timing.json" "videos/$id/voice_chunks" 2>/dev/null || true
            git diff --cached --quiet || (git commit -m "Voiceover for $id [skip ci]" && git pull --rebase -q && git push)
            gh release delete "video-$id" --yes --cleanup-tag >/dev/null 2>&1 || true
            TITLE=$(python -c "import json;print(json.load(open('videos/$id/meta.json'))['title'])")
            gh release create "video-$id" "out/$id/$id.mp4" "out/$id/thumbnail.jpg" "out/$id/youtube.txt" --title "$TITLE" --notes-file "out/$id/youtube.txt"
            echo "::endgroup::"
          done
