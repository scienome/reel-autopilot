name: Make reels
# Runs when a pull request adds or changes reels: makes the voiceover (ElevenLabs), renders each new reel and
# commits out/<id>.mp4 + out/<id>.jpg back onto the pull request, so you can watch them before merging.
on:
  pull_request:
    paths: ['reels/**', 'style/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg, Chromium and the font
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q playwright==1.48.0 numpy requests pillow
          python -m playwright install --with-deps chromium
          mkdir -p ~/.local/share/fonts && cp fonts/Montserrat.ttf ~/.local/share/fonts/ && fc-cache -f
      - name: Voice and render new reels
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python tools/produce.py --workers 4
      - name: Commit the videos to this pull request
        if: always()
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add out reels
          git diff --cached --quiet || (git commit -m "Render reels" && git push)
