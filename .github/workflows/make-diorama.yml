name: Make diorama reels
# By hand only: voices a dioramareels/ reel, renders it and publishes the Release diorama-<id>. It never posts.
on:
  workflow_dispatch:
    inputs:
      reel:
        description: 'Reel ids, space separated'
        required: true

permissions:
  contents: write

concurrency:
  group: make-diorama
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Voice, render, release
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REELS: ${{ inputs.reel }}
        run: |
          git config user.name "diorama-bot"; git config user.email "diorama-bot@users.noreply.github.com"
          for id in $REELS; do
            python tools/diorama_make.py "$id"
            git add "dioramareels/reels/$id/voice_lines"
            git diff --cached --quiet || (git commit -q -m "Voice for $id [skip ci]" && for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((i * 3)); done)
            gh release delete "diorama-$id" --yes --cleanup-tag >/dev/null 2>&1 || true
            gh release create "diorama-$id" "out/$id/$id.mp4" --title "diorama $id" --notes "Made by hand. Not posted."
          done
