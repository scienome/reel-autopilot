name: Check ElevenLabs key and voices
# Run by hand after changing ELEVENLABS_API_KEY: makes a 2-word test line ("Voice check.", 12 characters of credit)
# with every voice set in the config.json files (couple reels, Dave reels, mechanic reels and videos, toy reels,
# YouTube videos), the same text-to-speech call the reels use. About 50 characters in total; nothing is saved.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make a test line with every voice
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.request, urllib.error

          key = os.environ.get('ELEVENLABS_API_KEY', '')
          if not key:
              sys.exit('::error::ELEVENLABS_API_KEY is not set')

          def call(path, body=None):
              req = urllib.request.Request('https://api.elevenlabs.io/v1' + path, method='POST' if body else 'GET',
                                           data=json.dumps(body).encode() if body else None,
                                           headers={'xi-api-key': key, 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode(errors='replace')[:300]

          code, sub = call('/user/subscription')
          if code == 200:
              sub = json.loads(sub)
              print(f"Plan: {sub.get('tier')}, {sub.get('character_count')} of {sub.get('character_limit')} characters used this month")

          users = {}
          for cfg in ['config.json', 'davereels/config.json', 'mechreels/config.json', 'mechvideos/config.json',
                      'toyreels/config.json', 'youtube/config.json']:
              if os.path.exists(cfg):
                  v = json.load(open(cfg)).get('voice', {})
                  if v.get('voice_id'):
                      users.setdefault((v['voice_id'], v.get('model_id', 'eleven_multilingual_v2')), []).append(
                          os.path.dirname(cfg) or 'reels (couple)')

          bad = 0
          for (v, model), where in users.items():
              code, audio = call(f'/text-to-speech/{v}?output_format=mp3_22050_32', {'text': 'Voice check.', 'model_id': model})
              if code == 200 and len(audio) > 1000:
                  print(f"OK  {v} ({model})  {len(audio)} bytes of audio  used by: {', '.join(where)}")
              else:
                  print(f"::error::{v} (used by {', '.join(where)}) failed ({code}): {audio if isinstance(audio, str) else len(audio)}")
                  bad += 1
          sys.exit(1 if bad else 0)
          EOF
