name: Make diorama reels (parallel)
# Elites Endgame city reels (dioramareels/reels/<id>/). When a reel's script.json or reel.js changes on main, or by hand, each reel gets
# its own runner: ElevenLabs voice (takes kept in the repo), a CPU render (30-60 min) and the Release diorama-<id>. It never posts.
on:
  push:
    branches: [main]
    paths: ['dioramareels/reels/**/reel.js', 'dioramareels/reels/**/script.json']
  workflow_dispatch:
    inputs:
      reel:
        description: 'Reel ids, space separated (empty = every reel without a Release yet)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.reel }}" ]; then IDS="${{ inputs.reel }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            IDS=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- dioramareels/reels | grep -E '/(reel\.js|script\.json)$' | cut -d/ -f3 | sort -u | tr '\n' ' ')
          else IDS=""; fi
          if [ -z "$IDS" ]; then for d in dioramareels/reels/[0-9]*/; do id=$(basename "$d"); [ -f "$d/reel.js" ] && ! gh release view "diorama-$id" >/dev/null 2>&1 && IDS="$IDS $id"; done; fi
          LIST="[]"; for id in $IDS; do [ -f "dioramareels/reels/$id/reel.js" ] && LIST=$(python3 -c "import json,sys;l=json.loads(sys.argv[1]);l.append(sys.argv[2]);print(json.dumps(l))" "$LIST" "$id"); done
          echo "list=$LIST" >> "$GITHUB_OUTPUT"; echo "City reels to make: $LIST"
  make:
    needs: pick
    if: needs.pick.outputs.list != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        id: ${{ fromJSON(needs.pick.outputs.list) }}
    concurrency:
      group: make-diorama-${{ matrix.id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Voice, render, release
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ID: ${{ matrix.id }}
        run: |
          git config user.name "diorama-bot"; git config user.email "diorama-bot@users.noreply.github.com"
          python tools/diorama_make.py "$ID" --voice-only
          git add "dioramareels/reels/$ID/voice_lines"
          git diff --cached --quiet || (git commit -q -m "Voice for $ID [skip ci]" && for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((i * 4)); done)
          python tools/diorama_make.py "$ID"
          gh release delete "diorama-$ID" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "diorama-$ID" "out/$ID/$ID.mp4" --title "diorama $ID" --notes "Elites Endgame city reel. Not posted by this workflow."
