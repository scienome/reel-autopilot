name: Make POV reels
# "YOU are the only one" POV reels (povreels/ folder, the new Gears & Glitches series). When a reel folder changes on main (or you
# run this by hand), GitHub makes the voiceover, the ElevenLabs music and sound effects (audio.json), renders the 9:16 MP4 with the
# shared style/ engine, and publishes it as a Release "povreel-<id>" with the MP4, a cover frame and the caption. Nothing is posted.
on:
  push:
    branches: [main]
    paths: ['povreels/reels/**']
  workflow_dispatch:
    inputs:
      reel:
        description: 'Reel folder in povreels/reels to make, e.g. 001-dog-thoughts (empty = every reel without a release yet)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: make-povreels
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: povreels
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg, Chromium and the fonts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q playwright==1.48.0 numpy requests pillow
          python -m playwright install --with-deps chromium
          mkdir -p ~/.local/share/fonts && cp ../fonts/*.ttf ~/.local/share/fonts/ && fc-cache -f
      - name: Pick the reels to make
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.reel }}" ]; then
            LIST="${{ inputs.reel }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            LIST=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- reels | grep -v '/voice' | grep -v '/timing.json' | cut -d/ -f3 | sort -u | tr '\n' ' ')
          else
            LIST=""; for d in reels/*/; do id=$(basename "$d"); gh release view "povreel-$id" >/dev/null 2>&1 || LIST="$LIST $id"; done
          fi
          echo "list=$LIST" >> "$GITHUB_OUTPUT"; echo "Reels to make: $LIST"
      - name: Voice, render, release
        if: steps.pick.outputs.list != ''
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "reel-bot"; git config user.email "reel-bot@users.noreply.github.com"
          FAILED=""
          for id in ${{ steps.pick.outputs.list }}; do
            [ -f "reels/$id/story.js" ] || continue
            echo "::group::Making $id"
            git pull --rebase -q || true   # pick up voices a previous run already paid for
            if ! python tools/produce.py "reels/$id" --workers "$(nproc)" > "/tmp/$id.log" 2>&1; then
              cat "/tmp/$id.log"
              echo "::error::$id failed: $(tail -n 12 "/tmp/$id.log" | tr '\n' ' ' | cut -c1-900)"; FAILED="$FAILED $id"
              for f in voice.mp3 timing.json alignment.json voice_lines eleven; do git add "reels/$id/$f" 2>/dev/null || true; done   # paid once, kept
              git diff --cached --quiet || (git commit -m "Voiceover for POV reel $id [skip ci]" && git pull --rebase -q && git push)
              echo "::endgroup::"; continue
            fi
            cat "/tmp/$id.log"
            # keep the paid-for voice in the repo so a re-render never pays twice
            for f in voice.mp3 timing.json alignment.json voice_lines eleven; do git add "reels/$id/$f" 2>/dev/null || true; done   # paid once, kept
            git diff --cached --quiet || (git commit -m "Voiceover for POV reel $id [skip ci]" && git pull --rebase -q && git push)
            gh release delete "povreel-$id" --yes --cleanup-tag >/dev/null 2>&1 || true
            TITLE=$(python -c "import json;print(json.load(open('reels/$id/meta.json'))['title'])")
            gh release create "povreel-$id" "out/$id/$id.mp4" "out/$id/cover.jpg" "out/$id/caption.txt" --title "$TITLE" --notes-file "out/$id/caption.txt"
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then echo "::error::Not made:$FAILED"; exit 1; fi
