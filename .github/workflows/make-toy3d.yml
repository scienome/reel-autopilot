name: Make 3D toy reels
# 3D toy reels (toyreels/reels/<id>/ with reel.js, no story.js). When one changes on main (or you run this by hand), each reel gets
# its own runner: ElevenLabs voice (line by line, takes kept in the repo), a CPU render of the 3D scene (30-60 min), and the Release
# "toyreel-<id>" with the MP4, a cover frame and the caption. The toy poster (post-toyreels.yml) then posts it. This never posts.
on:
  push:
    branches: [main]
    paths: ['toyreels/reels/**/reel.js', 'toyreels/reels/**/script.json', 'dioramareels/kit/references/toy3d.js']
  workflow_dispatch:
    inputs:
      reel:
        description: '3D toy reel ids, space separated (empty = every 3D toy reel without a Release yet)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.reel }}" ]; then IDS="${{ inputs.reel }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            IDS=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- toyreels/reels | grep -E '/(reel\.js|script\.json)$' | cut -d/ -f3 | sort -u | tr '\n' ' ')
          else IDS=""; fi
          if [ -z "$IDS" ]; then for d in toyreels/reels/*/; do id=$(basename "$d"); [ -f "$d/reel.js" ] && ! gh release view "toyreel-$id" >/dev/null 2>&1 && IDS="$IDS $id"; done; fi
          LIST="[]"; for id in $IDS; do [ -f "toyreels/reels/$id/reel.js" ] && LIST=$(python3 -c "import json,sys;l=json.loads(sys.argv[1]);l.append(sys.argv[2]);print(json.dumps(l))" "$LIST" "$id"); done
          echo "list=$LIST" >> "$GITHUB_OUTPUT"; echo "3D toy reels to make: $LIST"
  make:
    needs: pick
    if: needs.pick.outputs.list != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        id: ${{ fromJSON(needs.pick.outputs.list) }}
    concurrency:
      group: make-toy3d-${{ matrix.id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q playwright requests
          python -m playwright install --with-deps chromium
      - name: Voice, render, release
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ID: ${{ matrix.id }}
        run: |
          git config user.name "reel-bot"; git config user.email "reel-bot@users.noreply.github.com"
          python tools/toy3d_make.py "$ID" --voice-only
          git add "toyreels/reels/$ID/voice_lines"
          git diff --cached --quiet || (git commit -q -m "Voice for 3D toy reel $ID [skip ci]" && for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((i * 4)); done)
          python tools/toy3d_make.py "$ID"
          gh release delete "toyreel-$ID" --yes --cleanup-tag >/dev/null 2>&1 || true
          TITLE=$(python -c "import json;print(json.load(open('toyreels/reels/$ID/meta.json'))['title'])")
          gh release create "toyreel-$ID" "out/$ID/$ID.mp4" "out/$ID/cover.jpg" "out/$ID/caption.txt" --title "$TITLE" --notes-file "out/$ID/caption.txt"
