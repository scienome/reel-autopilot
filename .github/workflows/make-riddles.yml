name: Make riddle reels
# Socho Zara riddles (riddles/reels). When a reel folder changes on main (or you run this by hand), GitHub voices it, renders
# the MP4 and publishes it as a Release named after the reel. Nothing is posted here; a reel posts once it is in riddles/schedule.json.
on:
  push:
    branches: [main]
    paths: ['riddles/reels/**']
  workflow_dispatch:
    inputs:
      reel:
        description: 'Reel folder in riddles/reels to make (empty = every reel without a Release yet)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: make-riddles
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg and Chromium
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q playwright==1.48.0 requests
          python -m playwright install --with-deps chromium
      - name: Voice, render, release
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "reel-bot"; git config user.email "reel-bot@users.noreply.github.com"
          if [ -n "${{ inputs.reel }}" ]; then
            LIST="${{ inputs.reel }}"
          else
            LIST=""; for d in riddles/reels/*/; do id=$(basename "$d"); gh release view "$id" >/dev/null 2>&1 || LIST="$LIST $id"; done
          fi
          echo "Reels to make: $LIST"
          FAILED=""
          for id in $LIST; do
            [ -f "riddles/reels/$id/story.js" ] || continue
            echo "::group::Making $id"
            git pull --rebase -q || true
            if ! python tools/riddle_make.py "riddles/reels/$id" --render "/tmp/$id.mp4" --workers "$(nproc)"; then
              echo "::error::$id failed"; FAILED="$FAILED $id"
            else
              gh release delete "$id" --yes --cleanup-tag >/dev/null 2>&1 || true
              gh release create "$id" "/tmp/$id.mp4" --title "$id" --notes "Riddle reel. Posts once it is in riddles/schedule.json."
            fi
            # keep the paid-for voice in the repo so a re-render never pays twice
            git add "riddles/reels/$id/voice" 2>/dev/null || true
            git diff --cached --quiet || (git commit -q -m "Voice for riddle $id [skip ci]" && git pull --rebase -q && git push -q)
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then echo "::error::Not made:$FAILED"; exit 1; fi
