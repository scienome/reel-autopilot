name: Post reel
# Posts the next rendered reel on main to Instagram, three times a day, at exactly 7:30 AM, 1:30 PM and 9:30 PM IST
# (02:00, 08:00 and 16:00 UTC). 7:30 AM IST = evening in the USA (about 9 PM New York, 6 PM California);
# 1:30 PM IST = lunchtime in India, early morning in the UK; 9:30 PM IST = prime time in India, late afternoon in
# the UK and lunchtime in the USA.
# GitHub starts scheduled runs late (90-125 minutes measured on this repo, Oct 2026), so every slot has three runs,
# 4, 3 and 2 hours before it. The first to start uploads the video so Instagram has it processed, then waits and
# publishes on the exact minute. The later runs queue behind it, see the slot is already posted and do nothing.
on:
  schedule:
    # 07:30 IST slot (02:00 UTC)
    - cron: '49 21 * * *'
    - cron: '49 22 * * *'
    - cron: '49 23 * * *'
    # 13:30 IST slot (08:00 UTC)
    - cron: '49 3 * * *'
    - cron: '49 4 * * *'
    - cron: '49 5 * * *'
    # 21:30 IST slot (16:00 UTC)
    - cron: '49 11 * * *'
    - cron: '49 12 * * *'
    - cron: '49 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show what would be posted'
        type: boolean
        default: true
      reel:
        description: 'Post this reel (folder name under reels/) instead of the next in the queue'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: post-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Post the next reel
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_COUCH_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_COUCH_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_COUCH_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/post.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }} ${{ github.event_name == 'schedule' && '--at 02:00,08:00,16:00' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.reel != '') && format('--reel {0}', inputs.reel) || '' }}
      - name: Record it in posted.json
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add posted.json couch_youtube_posted.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Posted a reel"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((i * 5)); done
          if git status -sb | head -1 | grep -q ahead; then echo "::error::could not save posted.json"; exit 1; fi
