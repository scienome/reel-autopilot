name: Post reel
# Posts the next rendered reel on main to Instagram, twice a day.
# GitHub cron is in UTC: 07:30 UTC = 1:00 PM IST, 14:30 UTC = 8:00 PM IST. GitHub may start scheduled runs a few
# minutes late when it is busy.
on:
  schedule:
    - cron: '30 7 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show what would be posted'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: post-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Post the next reel
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python tools/post.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
      - name: Record it in posted.json
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add posted.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Posted a reel" && git pull --rebase -q && git push)
